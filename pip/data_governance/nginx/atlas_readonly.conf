worker_processes  1;

# Keep error logs under the nginx prefix passed via `nginx -p ...`
error_log logs/error.log;
pid       logs/nginx.pid;

events {
  worker_connections  1024;
}

http {
  access_log logs/access.log;

  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Atlas internal (write-capable) instance.
  upstream atlas_internal {
    server 127.0.0.1:21001;
  }

  server {
    listen 21000;
    server_name _;

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow preflight
    if ($request_method = OPTIONS) { return 204; }

    # UI uses search endpoints; these might be POST even for read-only actions.
    location ~ ^/api/atlas/v2/search/ {
      limit_except GET HEAD POST OPTIONS { deny all; }
      proxy_pass http://atlas_internal;
    }

    # Everything else under /api/atlas is read-only for humans.
    location ~ ^/api/atlas/ {
      limit_except GET HEAD OPTIONS { deny all; }
      proxy_pass http://atlas_internal;
    }

    # UI assets + HTML
    location / {
      proxy_pass http://atlas_internal;
    }
  }
}
