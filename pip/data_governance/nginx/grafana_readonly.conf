worker_processes  1;

error_log logs/error.log;
pid       logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log logs/access.log;

  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8081;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    if ($request_method = OPTIONS) { return 204; }

    location = / {
      return 302 /api/grafana/;
    }

    location = /api/grafana {
      return 302 /api/grafana/;
    }

    location /api/grafana/ {
      auth_request /_auth_grafana;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Prefix /api/grafana;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8000/api/grafana/;
    }

    location = /_auth_grafana {
      internal;
      proxy_pass http://127.0.0.1:8000/api/grafana/auth;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
