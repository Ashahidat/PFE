<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestion utilisateurs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <h1>👥 Gestion des utilisateurs</h1>
        
        <div class="create-section">
            <h2>➕ Créer un utilisateur</h2>
            <input type="text" id="emp_id" placeholder="Employee ID">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Mot de passe">
            <input type="text" id="department" placeholder="Département">
            <select id="role">
                <option value="DATA_OWNER">DATA_OWNER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <button id="createBtn">Créer</button>
        </div>
        
        <div id="editForm" class="edit-form">
            <h2>✏️ Modifier l'utilisateur</h2>
            <input type="hidden" id="edit_employee_id">
            <input type="text" id="edit_username" placeholder="Username">
            <input type="password" id="edit_password" placeholder="Nouveau mot de passe">
            <input type="text" id="edit_department" placeholder="Département">
            <select id="edit_role">
                <option value="DATA_OWNER">DATA_OWNER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <button class="btn-save" id="saveEditBtn">💾 Enregistrer</button>
            <button class="btn-cancel" id="cancelEditBtn">❌ Annuler</button>
        </div>
        
        <h2>📋 Liste des utilisateurs</h2>
        <div id="usersList"></div>
    </div>
    
    <script src="js/navbar.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
