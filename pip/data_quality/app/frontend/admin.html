<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestion utilisateurs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
    <!-- ✅ En-tête avec lien vers profil -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>👥 Gestion des utilisateurs</h1>
        <a href="profile.html" style="background: #4CAF50; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none;">👤 Mon profil</a>
    </div>
    
    <!-- Formulaire de création -->
    <div class="create-section">
        <h2>➕ Créer un utilisateur</h2>
        <input type="text" id="emp_id" placeholder="Employee ID">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Mot de passe">
        <input type="text" id="department" placeholder="Département">
        <select id="role">
            <option value="DATA_OWNER">DATA_OWNER</option>
            <option value="ADMIN">ADMIN</option>
        </select>
        <button id="createBtn">Créer</button>
    </div>
    
    <!-- Formulaire de modification -->
    <div id="editForm" class="edit-form">
        <h2>✏️ Modifier l'utilisateur</h2>
        <input type="hidden" id="edit_employee_id">
        <div class="form-group">
            <label>Username :</label>
            <input type="text" id="edit_username" placeholder="Username">
        </div>
        <div class="form-group">
            <label>Mot de passe :</label>
            <input type="password" id="edit_password" placeholder="Nouveau mot de passe">
        </div>
        <div class="form-group">
            <label>Département :</label>
            <input type="text" id="edit_department" placeholder="Département">
        </div>
        <div class="form-group">
            <label>Rôle :</label>
            <select id="edit_role">
                <option value="DATA_OWNER">DATA_OWNER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="btn-save" id="saveEditBtn">💾 Enregistrer</button>
            <button class="btn-cancel" id="cancelEditBtn">❌ Annuler</button>
        </div>
    </div>
    
    <!-- Liste des utilisateurs -->
    <h2>📋 Liste des utilisateurs</h2>
    <div id="usersList"></div>
    
    <!-- ✅ Liens en bas -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
        <a href="projects.html" style="background: #007bff; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none;">📁 Accéder aux projets</a>
        <button id="logoutBtn" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Déconnexion</button>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
