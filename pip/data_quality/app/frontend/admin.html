<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestion utilisateurs</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <h1>👥 Gestion des utilisateurs</h1>
        
        <div class="create-section">
            <h2>➕ Créer un utilisateur</h2>
            <input type="text" id="emp_id" placeholder="Employee ID">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Mot de passe">
            <select id="department"></select>
            <select id="role">
                <option value="DATA_OWNER">DATA_OWNER — propriétaire de data</option>
                <option value="ADMIN">ADMIN — admin applicatif</option>
                <option value="ADMIN_GLOSSAIRE">ADMIN_GLOSSAIRE — gestion glossaire</option>
                <option value="SUPER_ADMIN">SUPER_ADMIN — super-admin</option>
                <option value="AUDIT">AUDIT — lecture</option>
            </select>
            <button id="createBtn">Créer</button>
        </div>

        <p class="muted" style="margin-top:-12px;">
            Ici tu gères les utilisateurs (rôle, département, activation). La gestion des départements et des périmètres
            <code>ADMIN_GLOSSAIRE</code> se fait dans “Départements”.
        </p>

        <div class="role-limit-panel">
            <h2>⚖️ Capacités des rôles critiques</h2>
            <div id="roleLimits" class="role-limit-list"></div>
        </div>
        
        <div id="editForm" class="edit-form">
            <h2>✏️ Modifier l'utilisateur</h2>
            <input type="hidden" id="edit_employee_id">
            <div class="form-group">
                <label>Username :</label>
                <input type="text" id="edit_username" placeholder="Username">
            </div>
            <div class="form-group">
                <label>Mot de passe :</label>
                <input type="password" id="edit_password" placeholder="Nouveau mot de passe (laisser vide = inchangé)">
            </div>
            <div class="form-group">
                <label>Département :</label>
                <select id="edit_department"></select>
            </div>
            <div class="form-group">
                <label>Rôle :</label>
                <select id="edit_role">
                    <option value="DATA_OWNER">DATA_OWNER — propriétaire de data</option>
                    <option value="ADMIN">ADMIN — admin applicatif</option>
                    <option value="ADMIN_GLOSSAIRE">ADMIN_GLOSSAIRE — gestion glossaire</option>
                    <option value="SUPER_ADMIN">SUPER_ADMIN — super-admin</option>
                    <option value="AUDIT">AUDIT — lecture</option>
                </select>
            </div>
            <div class="form-group">
                <label>Statut :</label>
                <select id="edit_is_active">
                    <option value="true">✅ Actif</option>
                    <option value="false">⛔ Inactif</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn-save" id="saveEditBtn">💾 Enregistrer</button>
                <button class="btn-cancel" id="cancelEditBtn">❌ Annuler</button>
            </div>
        </div>
        
        <h2>📋 Liste des utilisateurs</h2>
        <div id="usersList"></div>
    </div>
    
    <script src="js/navbar.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
