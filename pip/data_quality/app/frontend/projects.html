<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Projets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <h1>📁 Mes Projets</h1>
        
        <!-- ✅ Formulaire de création : caché pour AUDIT -->
        <div id="createProjectSection" class="create-section">
            <h2>➕ Créer un projet</h2>
            <input type="text" id="projectName" placeholder="Nom du projet">
            <input type="text" id="projectDesc" placeholder="Description">
            <div class="visibility-options">
                <label><input type="radio" name="visibility" value="PUBLIC" checked> 🌍 Public</label>
                <label><input type="radio" name="visibility" value="DEPARTMENT"> 🏢 Département</label>
            </div>
            <button id="createProjectBtn">Créer</button>
        </div>
        
        <h2>📋 Liste des projets</h2>
        <div id="projectsList"></div>
    </div>
    
    <script src="js/navbar.js"></script>
    <script>
        const role = localStorage.getItem("user_role");
        // Cacher le formulaire de création pour AUDIT
        if (role === "AUDIT") {
            const createSection = document.getElementById("createProjectSection");
            if (createSection) createSection.style.display = "none";
        }
    </script>
    <script src="js/projects.js"></script>
</body>
</html>
