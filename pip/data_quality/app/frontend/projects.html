<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes Projets</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
</head>
<body>
    <div class="container">
        <!-- ✅ En-tête avec lien vers profil -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>📁 Mes Projets</h1>
            <a href="profile.html" style="background: #4CAF50; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none;">👤 Mon profil</a>
        </div>
        
        <!-- Formulaire création projet -->
        <div class="card">
            <h2>Créer un nouveau projet</h2>
            <input type="text" id="projectName" placeholder="Nom du projet">
            <textarea id="projectDesc" placeholder="Description (optionnel)"></textarea>
            
            <div class="visibility-choice">
                <p><strong>Visibilité du projet :</strong></p>
                <label class="radio-label">
                    <input type="radio" name="visibility" value="DEPARTMENT" checked>
                    <span>🏢 Département (visible uniquement par mon département)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="visibility" value="PUBLIC">
                    <span>🌍 Public (visible par tous les DATA_OWNER)</span>
                </label>
            </div>
            
            <button id="createProjectBtn">Créer le projet</button>
        </div>

        <!-- Liste des projets -->
        <div class="card">
            <h2>Mes projets</h2>
            <div id="projectsList">
                <p class="loading">Chargement...</p>
            </div>
        </div>
        
        <!-- ✅ Bouton déconnexion -->
        <div style="margin-top: 20px; text-align: right;">
            <button id="logoutBtn" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Déconnexion</button>
        </div>
    </div>

    <script src="js/projects.js"></script>
</body>
</html>
