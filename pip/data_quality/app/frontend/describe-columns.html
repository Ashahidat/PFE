<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description des colonnes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/describe.css">
</head>
<body>
    <div class="container">
        <!-- Header avec progression -->
        <div class="header">
            <h1>📝 Description des colonnes</h1>
            <div class="progress">
                <span class="step completed">1. Upload</span>
                <span class="step completed">2. Preview</span>
                <span class="step active">3. Description</span>
                <span class="step">4. Tests</span>
            </div>
        </div>

        <!-- Infos du dataset -->
        <div class="dataset-info" id="datasetInfo">
            <h2 id="datasetName">Chargement...</h2>
            <p id="datasetMeta"></p>
        </div>

        <!-- Formulaire de description -->
        <form id="describeForm">
            <div class="form-header">
                <h3>Décrivez chaque colonne</h3>
                <p class="hint">
                    Ces descriptions seront visibles dans Apache Atlas. 
                    Plus c'est précis, mieux c'est !
                </p>
            </div>

        <!-- Liste des colonnes -->
        <div id="columnsList" class="columns-list">
            <!-- Injecté par JavaScript -->
        </div>

        <!-- Assignations glossaire -->
        <div class="assignment-panel form-section">
            <h3>🧩 Assigner un terme</h3>
            <p style="margin-bottom: 10px;">Associez un glossaire/terme/catégorie à ce dataset ou à une colonne.</p>
            <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
                <select id="assignmentCategorySelect"></select>
                <select id="assignmentTermSelect"></select>
                <select id="assignmentColumnSelect">
                    <option value="">Tout le dataset</option>
                </select>
                <button type="button" id="assignTermBtn" class="btn-primary">Assigner</button>
            </div>
            <div id="assignmentStatus" style="margin-top:10px;"></div>
            <div id="assignedList" style="margin-top:15px;"></div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <button type="button" id="skipBtn" class="btn-secondary">
                ⏭️ Passer aux tests
                </button>
                <button type="submit" id="saveBtn" class="btn-primary">
                    💾 Enregistrer et continuer
                </button>
            </div>
        </form>

        <!-- Message de statut -->
        <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <script src="js/describe.js"></script>
</body>
</html>
