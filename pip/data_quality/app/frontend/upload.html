<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Upload CSV</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/upload.css">
</head>
<body>
<div class="container">
    <h1>Upload CSV</h1>

    <!-- ✅ Projet sélectionné -->
    <div class="current-project">
        Projet actuel : <strong id="currentProjectName"></strong>
    </div>

    <!-- 📁 Fichier CSV -->
    <input type="file" id="csvFile">

    <!-- 🗂️ Assignation Glossaire (optionnel) -->
    <div class="form-group">
        <h2>Assignation Atlas (optionnel)</h2>
        <label for="uploadGlossarySelect">Glossaire</label>
        <select id="uploadGlossarySelect">
            <option value="">Chargement des glossaires...</option>
        </select>

        <label for="uploadCategorySelect">Catégorie</label>
        <select id="uploadCategorySelect" disabled>
            <option value="">Choisissez un glossaire</option>
        </select>

        <label for="uploadTermSelect">Terme</label>
        <select id="uploadTermSelect" disabled>
            <option value="">Choisissez un glossaire</option>
        </select>

        <small class="form-text text-muted">
            Ce terme sera lié au dataset entier (vous pourrez le modifier plus tard dans les assignations).
        </small>
        <div id="uploadGlossaryStatus" style="margin-top:8px; height:1.2em;"></div>
    </div>

    <!-- ✅ NOUVEAU : Description -->
    <div class="form-group">
        <label for="description">Description (optionnelle)</label>
        <textarea 
            id="description" 
            class="form-control" 
            rows="3"
            placeholder="Décrivez ce dataset (objectif, source, notes...)"
        ></textarea>
        <small class="form-text text-muted">
            Cette description sera visible dans Apache Atlas
        </small>
    </div>

    <button id="uploadBtn">Uploader</button>
    <div id="uploadStatus" class="hidden">En cours d'exécution...</div>
</div>

<script src="js/upload.js"></script>
</body>
</html>
