<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Glossaire</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .glossary-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-section input, .form-section textarea, .form-section select {
            margin: 5px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-section input[type="text"] {
            width: 200px;
        }
        .form-section textarea {
            width: 300px;
            height: 60px;
        }
        .term-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .term-info {
            flex: 1;
        }
        .term-info strong {
            font-size: 16px;
        }
        .term-info small {
            color: gray;
        }
        .btn-edit {
            background: #ffc107;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
        }
        .edit-form {
            background: #fff3cd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
        .edit-form.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="glossary-container">
        <h1>📖 Glossaire</h1>

        <!-- Section glossaires -->
        <div class="form-section">
            <h2>🗂️ Glossaires</h2>
            <input type="text" id="glossary-name" placeholder="Nom affiché *">
            <select id="glossary-dept"></select>
            <textarea id="glossary-description" placeholder="Description"></textarea>
            <button id="createGlossaryBtn" class="btn-save">Créer le glossaire</button>
            <div id="createGlossaryStatus" style="margin-top: 10px;"></div>
            <div id="glossaryList" style="margin-top: 15px;"></div>
        </div>

        <!-- Section catégories -->
        <div class="form-section">
            <h2>🧷 Catégories</h2>
            <select id="categoryGlossarySelect"></select>
            <input type="text" id="category-name" placeholder="Nom de la catégorie *">
            <textarea id="category-description" placeholder="Description"></textarea>
            <button id="createCategoryBtn" class="btn-save">Créer la catégorie</button>
            <div id="createCategoryStatus" style="margin-top: 10px;"></div>
            <div id="categoryList" style="margin-top: 15px;"></div>
        </div>

        <!-- Formulaire de création de terme -->
        <div class="form-section">
            <h2>➕ Ajouter un terme</h2>
            <select id="glossarySelect"></select>
            <input type="text" id="term" placeholder="Terme *">
            <textarea id="description" placeholder="Description"></textarea>
            <select id="categorySelect"></select>
            <div id="categoryHelp" style="font-size: 12px; color: #555; margin: 2px 0;">Sélectionnez un glossaire pour charger les catégories.</div>
            <button id="createBtn" class="btn-save">Ajouter</button>
            <div id="createStatus" style="margin-top: 10px;"></div>
        </div>

        <!-- Liste des termes -->
        <h2>📋 Termes du glossaire</h2>
        <div id="termsList">Chargement...</div>
    </div>
    
    <script src="js/api_config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/glossary.js"></script>
</body>
</html>
