<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Départements</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container">
        <h1>🏢 Départements</h1>
        <p class="muted" style="margin-top:-10px;">
            Les départements servent à contrôler l’accès aux projets et à cadrer les glossaires.
            Seuls les super-admins peuvent les gérer.
        </p>

        <div class="create-section">
            <h2>➕ Ajouter un département</h2>
            <input type="text" id="dept_code" placeholder="Code (ex: FINANCE)">
            <input type="text" id="dept_label" placeholder="Libellé (ex: Finance)">
            <button id="createDeptBtn">Ajouter</button>
            <div id="deptStatus" class="muted" style="margin-top:8px;"></div>
        </div>

        <div class="create-section">
            <h2>📋 Liste</h2>
            <div id="departmentsList"></div>
        </div>

        <div class="create-section">
            <h2>🔑 Périmètres ADMIN_GLOSSAIRE</h2>
            <p class="muted" style="margin-top:-10px;">
                Autorise un admin glossaire à créer/renommer des glossaires dans un département donné.
            </p>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input type="text" id="scope_emp" placeholder="Employee ID admin_glossaire">
                <select id="scope_dept"></select>
                <button id="grantScopeBtn">Autoriser</button>
                <button id="revokeScopeBtn">Retirer</button>
            </div>
            <div id="scopesList" style="margin-top:10px;"></div>
        </div>
    </div>

    <script src="js/api_config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/departments.js"></script>
</body>
</html>
