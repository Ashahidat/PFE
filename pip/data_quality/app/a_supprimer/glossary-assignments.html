<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Assignations Glossaire</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .assignment-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-section select, .form-section textarea, .form-section input {
            margin: 5px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .term-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div class="assignment-container">
        <h1>📦 Assignations Glossaire</h1>
        <div class="form-section">
            <h2>Associer un terme à un dataset ou une colonne</h2>
            <select id="datasetSelect"></select>
            <select id="columnSelect"></select>
            <select id="categoryFilterSelect"></select>
            <select id="termAssignSelect"></select>
            <button id="assignBtn" class="btn-save">Assigner</button>
            <div id="assignStatus" style="margin-top:10px;"></div>
        </div>
        <div class="form-section">
            <h2>Glossaire / catégories disponibles</h2>
            <p>Sélectionnez un dataset à gauche, puis terminez le lien sur un terme/glossaire. Vous pouvez ensuite voir et retirer les assignations ci-dessous.</p>
            <div id="assignedList">Chargement...</div>
        </div>
    </div>
    <script src="js/api_config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/assignments.js"></script>
</body>
</html>
